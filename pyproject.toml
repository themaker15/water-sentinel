[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-sentinel"
version = "1.1.0"
description = "Real-time water-quality anomaly detection with an ESP32 and low-cost sensors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
umap = ["umap-learn"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 130
extend-exclude = ["runtime", "frontend"]

[tool.ruff.lint]
# real bugs only for now: syntax errors, undefined names, unused imports/variables, mutable defaults
select = ["E9", "F63", "F7", "F82", "F401", "F841", "B006"]
